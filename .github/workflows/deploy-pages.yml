name: Deploy public demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm ci` can omit Rollup's platform-specific optional binary when the
      # lockfile was created on macOS but this job runs on Linux. Re-resolving
      # dependencies on the runner installs the required Linux optional package.
      - run: npm install --include=optional --no-audit --no-fund
      - run: npm run build --workspace @el-guapo/workbench
        env:
          VITE_PUBLIC_DEMO: "true"
          VITE_BASE_PATH: /El-Guapo-Platform/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/workbench/dist
      - id: deployment
        uses: actions/deploy-pages@v4
